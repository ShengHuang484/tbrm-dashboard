name: New-low research checks

on:
  pull_request:
    paths:
      - 'scripts/corporate_action_*.py'
      - 'scripts/twse_corporate_action_parser.py'
      - 'tests/test_*new_low*.py'
      - 'tests/test_corporate_action*.py'
      - 'tests/test_twse_corporate_action_parser.py'
      - 'data/new_low.json'
      - '.github/workflows/new-low-research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated research checks
        run: python -m unittest discover -s tests -p 'test_*new_low*.py' -v && python -m unittest discover -s tests -p 'test_corporate_action*.py' -v && python -m unittest discover -s tests -p 'test_twse_corporate_action_parser.py' -v
