name: Test VIXTWN official download
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official monthly files
        shell: python
        run: |
          import urllib.request
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=8)))
          months = [now, now.replace(day=1)-timedelta(days=1)]
          success = False
          for month in months:
              for folder in ('log2data', 'log2data_eng'):
                  url = f'https://www.taifex.com.tw/file/taifex/Dailydownload/vix/{folder}/{month:%Y%m}new.txt'
                  print('\nURL:', url)
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0', 'Referer':'https://www.taifex.com.tw/cht/7/vixDaily3MNew'})
                      with urllib.request.urlopen(req, timeout=25) as response:
                          raw = response.read(2000000)
                          print('HTTP:', response.status, 'Content-Type:', response.headers.get('Content-Type'), 'Bytes:', len(raw))
                      for encoding in ('utf-8-sig', 'cp950', 'big5'):
                          try:
                              body = raw.decode(encoding)
                              break
                          except UnicodeDecodeError:
                              continue
                      else:
                          raise ValueError('Unknown encoding')
                      if not body.strip() or '<html' in body.lower() or '<!doctype' in body.lower():
                          raise ValueError('Empty or HTML response')
                      lines = body.splitlines()
                      print('Encoding:', encoding, 'Lines:', len(lines))
                      print('First 6 lines:', repr(lines[:6]))
                      print('Last 4 lines:', repr(lines[-4:]))
                      success = True
                  except Exception as exc:
                      print('DOWNLOAD FAILED:', repr(exc))
          if not success:
              raise SystemExit('No readable monthly file obtained')
