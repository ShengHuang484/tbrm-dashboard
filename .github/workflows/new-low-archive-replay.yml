name: New-low archived evidence replay

on:
  push:
    branches:
      - research/new-low-quality-gates-20261123
    paths:
      - '.github/workflows/new-low-archive-replay.yml'
      - 'scripts/*.py'
      - 'research/*.json'
      - 'research/issuer_master_*.csv'
      - 'data/history/new_low_closes.json'
  pull_request:
    paths:
      - '.github/workflows/new-low-archive-replay.yml'
      - 'scripts/*.py'
      - 'research/*.json'
      - 'research/issuer_master_*.csv'
      - 'data/history/new_low_closes.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Production market refreshes roll the tracked snapshot independently.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve the pinned research archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14785003044/zip" > first-month.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14769425450/zip" > subsequent-months.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14785278974/zip" > lifecycle.zip
          unzip -p lifecycle.zip delistings.html > delistings.html
      - name: Recompute 990-factor counts and both quote policies
        run: |
          python -m scripts.action_completeness data/history/new_low_closes.json \
            --monthly-archives first-month.zip subsequent-months.zip > adjusted.json
          python -m scripts.new_low_policy_sensitivity data/history/new_low_closes.json \
            adjusted.json > sensitivity.json
          python -m scripts.new_low_replay_check adjusted.json research/monthly_action_run.json \
            sensitivity.json research/quote_policy_sensitivity.json
      - name: Replay issuer security-type scope
        run: |
          python -m scripts.issuer_universe compare data/history/new_low_closes.json adjusted.json \
            research/issuer_master_20261122.csv 2026-11-22 > issuer-scope.json
          diff -u research/issuer_scope_result.json issuer-scope.json
      - name: Replay above-market subscription sensitivity
        run: |
          python -m scripts.new_low_rights_scenario data/history/new_low_closes.json adjusted.json \
            research/1312_rights_basis.json > rights-scenario.json
          diff -u research/1312_rights_scenario.json rights-scenario.json
      - name: Verify historical listing interval memberships
        run: |
          python -m scripts.historical_listing_replay data/history/new_low_closes.json adjusted.json \
            research/issuer_master_20261122.csv research/historical_listing_evidence.json \
            --listings-archive research/lifecycle_crosscheck_results.json \
            --delistings-archive delistings.html > historical-listing.json
          diff -u research/historical_listing_result.json historical-listing.json
      - name: Replay missing-close attribution and study impact
        run: |
          python -m scripts.historical_listing_replay data/history/new_low_closes.json adjusted.json \
            research/issuer_master_20261122.csv research/historical_listing_evidence.json \
            --strict-report > strict-gap-source.json
          python -m scripts.historical_roster_check strict-gap-source.json > daily-roster.json
          python -m scripts.corporate_action_basis_scan data/history/new_low_closes.json \
            strict-gap-source.json research/1312_rights_basis.json first-month.zip subsequent-months.zip \
            > rights-basis-scan.json
          diff -u research/rights_basis_scan.json rights-basis-scan.json
          python -m scripts.missing_close_audit data/history/new_low_closes.json strict-gap-source.json \
            historical-listing.json research/endpoint_gap_results.json \
            research/endpoint_gap_evidence.json --official-evidence research/twse_stock_day_gap_evidence.json \
            --summary > gap-summary.json
          diff -u research/missing_close_summary.json gap-summary.json
          python -m scripts.missing_close_audit data/history/new_low_closes.json strict-gap-source.json \
            historical-listing.json research/endpoint_gap_results.json \
            research/endpoint_gap_evidence.json --official-evidence research/twse_stock_day_gap_evidence.json \
            > missing-close-full.json
      - uses: actions/upload-artifact@v4
        with:
          name: new-low-missing-close-review
          path: |
            missing-close-full.json
            daily-roster.json
            rights-basis-scan.json
          retention-days: 30
