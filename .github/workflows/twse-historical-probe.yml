name: TWSE historical 13-month backfill probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/twse-historical-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/new-low-quality-gates-20261123
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run research tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Probe 13 historical months
        run: python -m scripts.twse_event_download --start 2025-11 --end 2026-11 --out twse-probe
      - name: Audit TWSE event extraction (research only)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.twse_event_extract import extract_candidates
          root = Path("twse-probe")
          if not (root / "manifest.json").exists():
              print("No manifest available")
              raise SystemExit(0)
          manifest = json.loads((root / "manifest.json").read_text())
          summary = []
          for entry in manifest["entries"]:
              item = {"month": entry["month"], "status": entry["status"], "candidate_count": 0}
              if entry["status"] == "downloaded_unverified":
                  try:
                      payload = json.loads((root / entry["file"]).read_text(encoding="utf-8-sig"))
                      candidates = extract_candidates(payload, entry["source_url"])
                      item["candidate_count"] = len(candidates)
                      item["status"] = "parsed_unverified"
                      item["sample"] = candidates[:1]
                  except Exception as exc:
                      item["status"] = "parse_failed"
                      item["error"] = type(exc).__name__ + ": " + str(exc)[:300]
                      item["fields"] = payload.get("fields")
              summary.append(item)
          report = {"months": summary, "score_eligible": False, "corporate_action_completeness_verified": False}
          (root / "candidate_audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          failed = [m["month"] for m in summary if m["status"] != "parsed_unverified"]
          if failed:
              raise SystemExit("TWSE candidate extraction failed for: " + ", ".join(failed))
          PY
      - name: Audit duplicate and conflicting TWSE events
        if: always()
        run: |
          if [ -f twse-probe/manifest.json ]; then
            python -m scripts.twse_event_identity_audit twse-probe
          fi
      - name: Reconcile candidate events against saved raw closes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from scripts.twse_event_extract import extract_candidates
          from scripts.corporate_action_reconcile import reconcile_candidates
          root = Path("twse-probe")
          manifest_path = root / "manifest.json"
          history_path = Path("data/history/new_low_closes.json")
          if not manifest_path.exists() or not history_path.exists():
              print("Missing TWSE manifest or stock close history")
              raise SystemExit(1)
          manifest = json.loads(manifest_path.read_text())
          history = json.loads(history_path.read_text())
          dates = sorted(history)
          events = []
          for entry in manifest["entries"]:
              if entry["status"] != "downloaded_unverified":
                  raise SystemExit("Cannot reconcile failed month: " + entry["month"])
              payload = json.loads((root / entry["file"]).read_text(encoding="utf-8-sig"))
              events.extend(extract_candidates(payload, entry["source_url"]))
          result = reconcile_candidates(events, history, dates)
          from decimal import Decimal
          matched_checks = [c for c in result["checks"] if c["status"] == "matched_price_basis"]
          exact = [c for c in matched_checks if Decimal(c["relative_difference"]) == 0]
          tight = [c for c in matched_checks if Decimal("0") < Decimal(c["relative_difference"]) <= Decimal("0.001")]
          loose = [c for c in matched_checks if Decimal(c["relative_difference"]) > Decimal("0.001")]
          result["price_precision_audit"] = {
              "matched_within_1_1_percent": len(matched_checks),
              "exact_price_matches": len(exact),
              "nonzero_deviation_up_to_0_1_percent": len(tight),
              "deviation_over_0_1_up_to_1_1_percent": len(loose),
              "largest_deviations": sorted(matched_checks, key=lambda c: Decimal(c["relative_difference"]), reverse=True)[:15],
              "strict_price_basis_verified": False,
              "score_eligible": False,
          }
          result["status_counts"] = dict(Counter(c["status"] for c in result["checks"]))
          result["history_days"] = len(dates)
          result["candidate_count"] = len(events)
          result["sample_unresolved"] = [c for c in result["checks"] if c["status"] != "matched_price_basis"][:15]
          result["missing_event_dates"] = sorted({c["ex_date"] for c in result["checks"] if c["status"] == "event_date_not_in_history"})
          result["unresolved_by_date"] = dict(Counter(c["ex_date"] for c in result["checks"] if c["status"] != "matched_price_basis"))
          result["corporate_action_completeness_verified"] = False
          result["score_eligible"] = False
          (root / "price_reconciliation.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps({k: v for k, v in result.items() if k != "checks"}, ensure_ascii=False))
          PY
      - name: Check missing event dates against official TWSE trading calendar
        if: always()
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          root = Path("twse-probe")
          report_path = root / "price_reconciliation.json"
          if not report_path.exists():
              raise SystemExit("Missing reconciliation report")
          report = json.loads(report_path.read_text())
          results = []
          for day in report.get("missing_event_dates", []):
              month = day[:7].replace("-", "")
              url = "https://www.twse.com.tw/exchangeReport/FMTQIK?response=json&date=" + month + "01"
              item = {"date": day, "url": url, "calendar_verified": False}
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  if payload.get("stat") != "OK" or not isinstance(payload.get("data"), list):
                      raise ValueError("invalid TWSE calendar response")
                  dates = set()
                  for row in payload["data"]:
                      match = re.fullmatch(r"(\d{2,3})/(\d{1,2})/(\d{1,2})", str(row[0]))
                      if not match:
                          raise ValueError("unrecognized TWSE calendar date")
                      dates.add(f"{int(match[1])+1911:04d}-{int(match[2]):02d}-{int(match[3]):02d}")
                  item.update({"calendar_verified": True, "is_trading_day": day in dates, "month_trading_days": len(dates)})
              except Exception as exc:
                  item["error"] = type(exc).__name__ + ": " + str(exc)[:200]
              results.append(item)
          output = {"dates": results, "score_eligible": False}
          (root / "missing_date_calendar_audit.json").write_text(json.dumps(output, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(output, ensure_ascii=False))
          if any(not x["calendar_verified"] for x in results):
              raise SystemExit("TWSE trading calendar could not be verified")
          PY
      - name: Preserve source rows for non-trading-day events
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("twse-probe")
          calendar_path = root / "missing_date_calendar_audit.json"
          manifest_path = root / "manifest.json"
          if not calendar_path.exists() or not manifest_path.exists():
              raise SystemExit("Missing source evidence for non-trading-day event audit")
          calendar = json.loads(calendar_path.read_text())
          missing = {d["date"] for d in calendar["dates"] if d.get("calendar_verified") and not d.get("is_trading_day")}
          manifest = json.loads(manifest_path.read_text())
          rows = []
          for entry in manifest["entries"]:
              if entry["status"] != "downloaded_unverified":
                  continue
              payload = json.loads((root / entry["file"]).read_text(encoding="utf-8-sig"))
              tables = payload.get("tables", [payload])
              for table in tables:
                  fields = table.get("fields", [])
                  if not isinstance(fields, list):
                      continue
                  date_name = next((x for x in ("除權息日期", "資料日期") if x in fields), None)
                  if date_name is None:
                      continue
                  for values in table.get("data", []):
                      if not isinstance(values, list) or len(values) != len(fields):
                          continue
                      raw_date = str(values[fields.index(date_name)])
                      import re
                      m = re.fullmatch(r"(\d{2,3})年(\d{1,2})月(\d{1,2})日", raw_date)
                      if not m:
                          continue
                      day = f"{int(m[1])+1911:04d}-{int(m[2]):02d}-{int(m[3]):02d}"
                      if day in missing:
                          rows.append({"date": day, "month": entry["month"], "source_url": entry["source_url"], "official_row": dict(zip(fields, values))})
          from collections import Counter
          from scripts.twse_event_extract import extract_candidates
          candidate_keys = set()
          for entry in manifest["entries"]:
              if entry["status"] != "downloaded_unverified":
                  continue
              payload = json.loads((root / entry["file"]).read_text(encoding="utf-8-sig"))
              for event in extract_candidates(payload, entry["source_url"]):
                  if event["ex_date"] in missing:
                      candidate_keys.add((event["ex_date"], event["code"]))
          extracted_keys = {(r["date"], str(r["official_row"].get("股票代號", ""))) for r in rows}
          unmatched_candidates = sorted(candidate_keys - extracted_keys)
          excluded_source_rows = [r for r in rows if (r["date"], str(r["official_row"].get("股票代號", ""))) not in candidate_keys]
          result = {"non_trading_event_dates": sorted(missing), "source_rows": rows,
                    "candidate_event_count": len(candidate_keys),
                    "source_row_count": len(rows),
                    "unmatched_candidates": unmatched_candidates,
                    "excluded_source_rows": excluded_source_rows,
                    "source_identity_audit_passed": not unmatched_candidates,
                    "requires_official_effective_date_verification": True,
                    "score_eligible": False}
          (root / "non_trading_event_source_rows.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
          if missing and not rows:
              raise SystemExit("No official source rows extracted for non-trading-day events")
          if unmatched_candidates:
              raise SystemExit("Missing original source rows for candidate events")
          print(json.dumps({"non_trading_event_dates": sorted(missing), "candidate_event_count": len(candidate_keys), "excluded_source_rows": excluded_source_rows, "source_row_count": len(rows),
                            "sample": rows[:2], "score_eligible": False}, ensure_ascii=False))
          PY
      - name: Classify non-trading-day event conflicts without date shifting
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("twse-probe")
          required = ["price_reconciliation.json", "missing_date_calendar_audit.json", "non_trading_event_source_rows.json"]
          for name in required:
              if not (root / name).exists():
                  raise SystemExit("Missing required audit: " + name)
          reconciliation = json.loads((root / required[0]).read_text())
          calendar = json.loads((root / required[1]).read_text())
          source = json.loads((root / required[2]).read_text())
          official_nontrading = {d["date"] for d in calendar["dates"] if d.get("calendar_verified") and d.get("is_trading_day") is False}
          unresolved = [c for c in reconciliation["checks"] if c["status"] == "event_date_not_in_history"]
          source_keys = {(r["date"], str(r["official_row"]["股票代號"])) for r in source["source_rows"]}
          conflicts = []
          for event in unresolved:
              key = (event["ex_date"], event["code"])
              if key in source_keys and event["ex_date"] in official_nontrading:
                  conflicts.append({"code": event["code"], "reported_date": event["ex_date"],
                                    "classification": "official_event_date_conflicts_with_official_trading_calendar",
                                    "date_reassignment_allowed": False})
          report = {"unresolved_event_count": len(unresolved), "calendar_conflict_count": len(conflicts),
                    "conflicts": conflicts, "date_reassignment_allowed": False,
                    "corporate_action_completeness_verified": False, "score_eligible": False}
          (root / "nontrading_event_conflicts.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps({"unresolved_event_count": len(unresolved), "calendar_conflict_count": len(conflicts),
                            "score_eligible": False}, ensure_ascii=False))
          if len(conflicts) != len(unresolved):
              raise SystemExit("Unclassified missing-date event: inspect source and calendar")
          PY
      - name: Build research-only exception review queue
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("twse-probe")
          names = ("nontrading_event_conflicts.json", "non_trading_event_source_rows.json",
                   "price_reconciliation.json", "missing_date_calendar_audit.json")
          if any(not (root / n).exists() for n in names):
              raise SystemExit("Missing required exception evidence")
          conflicts, sources, reconciliation, calendar = [
              json.loads((root / n).read_text()) for n in names
          ]
          source_map = {}
          for row in sources["source_rows"]:
              key = (row["date"], str(row["official_row"].get("股票代號", "")))
              if key in source_map:
                  raise SystemExit("Duplicate original event identity: " + str(key))
              source_map[key] = row
          prior_map = {(r["ex_date"], r["code"]): r for r in reconciliation["checks"]}
          calendar_map = {r["date"]: r for r in calendar["dates"]}
          queue = []
          for item in conflicts["conflicts"]:
              key = (item["reported_date"], item["code"])
              source = source_map.get(key)
              check = prior_map.get(key)
              day = calendar_map.get(key[0])
              if source is None or check is None or day is None:
                  raise SystemExit("Missing supporting evidence for: " + str(key))
              if day.get("is_trading_day") is not False or not day.get("calendar_verified"):
                  raise SystemExit("Calendar not verified as non-trading day: " + str(key))
              raw = source["official_row"]
              queue.append({
                  "code": item["code"], "reported_date": item["reported_date"],
                  "name": raw.get("股票名稱"), "event_type": raw.get("權/息"),
                  "official_prior_close": raw.get("除權息前收盤價"),
                  "official_reference_price": raw.get("除權息參考價"),
                  "source_detail": raw.get("詳細資料"),
                  "preceding_available_date": check.get("preceding_available_date"),
                  "source_url": source["source_url"],
                  "review_status": "requires_independent_effective_date_evidence",
                  "approved_adjustment_date": None,
                  "score_eligible": False
              })
          queue.sort(key=lambda x: (x["reported_date"], x["code"]))
          report = {"exception_count": len(queue), "exceptions": queue,
                    "all_exceptions_source_backed": len(queue) == len(conflicts["conflicts"]),
                    "date_reassignment_allowed": False, "score_eligible": False}
          (root / "effective_date_review_queue.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps({"exception_count": len(queue),
                            "codes_by_date": {day: [r["code"] for r in queue if r["reported_date"] == day]
                                              for day in sorted({r["reported_date"] for r in queue})},
                            "score_eligible": False}, ensure_ascii=False))
          if len(queue) != len(conflicts["conflicts"]):
              raise SystemExit("Incomplete effective-date review queue")
          PY
      - name: Publish explicit research scoring gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("twse-probe")
          required = ["price_reconciliation.json", "effective_date_review_queue.json",
                      "identity_audit.json", "missing_date_calendar_audit.json"]
          if any(not (root / name).exists() for name in required):
              raise SystemExit("Missing research gate evidence")
          price, exceptions, identity, calendar = [
              json.loads((root / name).read_text()) for name in required
          ]
          precision = price["price_precision_audit"]
          blockers = []
          if not identity["identity_audit_passed"]:
              blockers.append("duplicate_or_conflicting_event_identities")
          if precision["exact_price_matches"] != price["matched"]:
              blockers.append("nonexact_prior_close_matches")
          if exceptions["exception_count"]:
              blockers.append("unresolved_official_nontrading_event_dates")
          blockers.extend(["capital_reduction_and_other_action_coverage_unverified",
                           "daily_stock_universe_and_adjusted_price_series_unverified"])
          report = {
              "candidate_events": price["candidate_count"],
              "exact_prior_close_matches": precision["exact_price_matches"],
              "unresolved_effective_dates": exceptions["exception_count"],
              "blocking_reasons": blockers,
              "corporate_action_completeness_verified": False,
              "score_eligible": False,
              "official_confirmation_points_enabled": 45,
              "official_confirmation_points_total": 50
          }
          (root / "research_scoring_gate.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(report, ensure_ascii=False))
          if price["candidate_count"] != price["matched"] + price["unresolved"]:
              raise SystemExit("Inconsistent candidate reconciliation counts")
          PY
      - name: Audit 262-day raw stock universe (strict prior 252-day coverage)
        if: always()
        run: |
          python -m scripts.new_low_universe_audit data/history/new_low_closes.json twse-probe/raw_universe_audit.json
      - name: Cross-check 24 missing-quote dates with official TWSE daily detail
        run: |
          python -m scripts.twse_quote_gap_crosscheck data/history/new_low_closes.json twse-probe/raw_universe_audit.json twse-probe/official_quote_gap_crosscheck.json
      - name: Cross-check next 24 missing-quote dates (batch 2)
        run: |
          python -m scripts.twse_quote_gap_crosscheck data/history/new_low_closes.json twse-probe/raw_universe_audit.json twse-probe/official_quote_gap_crosscheck_batch2.json --offset 24 --max-dates 24
      - name: Consolidate all new-low readiness blockers
        run: python -m scripts.new_low_readiness twse-probe
      - name: Print probe manifest
        if: always()
        run: |
          if [ -f twse-probe/manifest.json ]; then cat twse-probe/manifest.json; fi
      - name: Save research-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-13-month-research
          path: twse-probe/
          retention-days: 7
          if-no-files-found: warn
