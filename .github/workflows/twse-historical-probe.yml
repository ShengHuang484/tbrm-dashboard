name: TWSE historical 13-month backfill probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/twse-historical-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/new-low-quality-gates-20261123
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run research tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Probe 13 historical months
        run: python -m scripts.twse_event_download --start 2025-11 --end 2026-11 --out twse-probe
      - name: Audit TWSE event extraction (research only)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.twse_event_extract import extract_candidates
          root = Path("twse-probe")
          if not (root / "manifest.json").exists():
              print("No manifest available")
              raise SystemExit(0)
          manifest = json.loads((root / "manifest.json").read_text())
          summary = []
          for entry in manifest["entries"]:
              item = {"month": entry["month"], "status": entry["status"], "candidate_count": 0}
              if entry["status"] == "downloaded_unverified":
                  try:
                      payload = json.loads((root / entry["file"]).read_text(encoding="utf-8-sig"))
                      candidates = extract_candidates(payload, entry["source_url"])
                      item["candidate_count"] = len(candidates)
                      item["status"] = "parsed_unverified"
                      item["sample"] = candidates[:1]
                  except Exception as exc:
                      item["status"] = "parse_failed"
                      item["error"] = type(exc).__name__ + ": " + str(exc)[:300]
                      item["fields"] = payload.get("fields")
              summary.append(item)
          report = {"months": summary, "score_eligible": False, "corporate_action_completeness_verified": False}
          (root / "candidate_audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\\n")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          failed = [m["month"] for m in summary if m["status"] != "parsed_unverified"]
          if failed:
              raise SystemExit("TWSE candidate extraction failed for: " + ", ".join(failed))
          PY
      - name: Audit duplicate and conflicting TWSE events
        if: always()
        run: |
          if [ -f twse-probe/manifest.json ]; then
            python -m scripts.twse_event_identity_audit twse-probe
          fi
      - name: Reconcile candidate events against saved raw closes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from scripts.twse_event_extract import extract_candidates
          from scripts.corporate_action_reconcile import reconcile_candidates
          root = Path("twse-probe")
          manifest_path = root / "manifest.json"
          history_path = Path("data/history/new_low_closes.json")
          if not manifest_path.exists() or not history_path.exists():
              print("Missing TWSE manifest or stock close history")
              raise SystemExit(1)
          manifest = json.loads(manifest_path.read_text())
          history = json.loads(history_path.read_text())
          dates = sorted(history)
          events = []
          for entry in manifest["entries"]:
              if entry["status"] != "downloaded_unverified":
                  raise SystemExit("Cannot reconcile failed month: " + entry["month"])
              payload = json.loads((root / entry["file"]).read_text(encoding="utf-8-sig"))
              events.extend(extract_candidates(payload, entry["source_url"]))
          result = reconcile_candidates(events, history, dates)
          result["status_counts"] = dict(Counter(c["status"] for c in result["checks"]))
          result["history_days"] = len(dates)
          result["candidate_count"] = len(events)
          result["sample_unresolved"] = [c for c in result["checks"] if c["status"] != "matched_price_basis"][:15]
          result["missing_event_dates"] = sorted({c["ex_date"] for c in result["checks"] if c["status"] == "event_date_not_in_history"})
          result["unresolved_by_date"] = dict(Counter(c["ex_date"] for c in result["checks"] if c["status"] != "matched_price_basis"))
          result["corporate_action_completeness_verified"] = False
          result["score_eligible"] = False
          (root / "price_reconciliation.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\\n")
          print(json.dumps({k: v for k, v in result.items() if k != "checks"}, ensure_ascii=False))
          PY
      - name: Check missing event dates against official TWSE trading calendar
        if: always()
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          root = Path("twse-probe")
          report_path = root / "price_reconciliation.json"
          if not report_path.exists():
              raise SystemExit("Missing reconciliation report")
          report = json.loads(report_path.read_text())
          results = []
          for day in report.get("missing_event_dates", []):
              month = day[:7].replace("-", "")
              url = "https://www.twse.com.tw/exchangeReport/FMTQIK?response=json&date=" + month + "01"
              item = {"date": day, "url": url, "calendar_verified": False}
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  if payload.get("stat") != "OK" or not isinstance(payload.get("data"), list):
                      raise ValueError("invalid TWSE calendar response")
                  dates = set()
                  for row in payload["data"]:
                      match = re.fullmatch(r"(\\d{2,3})/(\\d{1,2})/(\\d{1,2})", str(row[0]))
                      if not match:
                          raise ValueError("unrecognized TWSE calendar date")
                      dates.add(f"{int(match[1])+1911:04d}-{int(match[2]):02d}-{int(match[3]):02d}")
                  item.update({"calendar_verified": True, "is_trading_day": day in dates, "month_trading_days": len(dates)})
              except Exception as exc:
                  item["error"] = type(exc).__name__ + ": " + str(exc)[:200]
              results.append(item)
          output = {"dates": results, "score_eligible": False}
          (root / "missing_date_calendar_audit.json").write_text(json.dumps(output, ensure_ascii=False, indent=2) + "\\n")
          print(json.dumps(output, ensure_ascii=False))
          if any(not x["calendar_verified"] for x in results):
              raise SystemExit("TWSE trading calendar could not be verified")
          PY
      - name: Print probe manifest
        if: always()
        run: |
          if [ -f twse-probe/manifest.json ]; then cat twse-probe/manifest.json; fi
      - name: Save research-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-13-month-research
          path: twse-probe/
          retention-days: 7
          if-no-files-found: warn
