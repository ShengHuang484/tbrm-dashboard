name: Market update regression tests
on:
  pull_request:
    paths:
      - '.github/workflows/*market*.yml'
      - 'scripts/market_refresh.py'
      - 'scripts/update_snapshot.py'
      - 'data/market_calendar.json'
      - 'index.html'
      - 'tests/test_market*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_market*.py' -v
      - run: node --test tests/test_market_dashboard.cjs
