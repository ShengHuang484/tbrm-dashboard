name: Update official market snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1-5' # 14:30 Taiwan time, weekdays
    - cron: '7 7 * * 1-5' # 15:07 Taiwan time, backup
    - cron: '37 8 * * 1-5' # 16:37 Taiwan time, backup
    - cron: '15 9 * * 1-5' # 17:15 Taiwan time, weekdays
    - cron: '30 13 * * 1-5' # 21:30 Taiwan time, primary margin backfill
    - cron: '30 14 * * 1-5' # 22:30 Taiwan time, delayed margin retry
    - cron: '0 0 * * 1-6' # 08:00 Taiwan time, next-morning reconciliation (Mon-Sat)
permissions:
  contents: read
concurrency:
  group: official-market-snapshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official trading session and refresh snapshots
        run: python -m scripts.market_refresh
      - name: Publish snapshots and freshness status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update official market snapshots"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git pull --rebase origin "$GITHUB_REF_NAME"
            done
          fi
      - name: Fail visibly if the expected close is stale
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status = json.loads(Path("data/market_update_status.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### 市場資料核對\n")
              for field in ("status", "expected_session", "last_valid_session", "download_status"):
                  summary.write(f"- {field}: {status.get(field)}\n")
              for source, warning in status["warnings"].items():
                  warning = str(warning).replace("\n", " ")[:240]
                  summary.write(f"- {source}: {warning}\n")
          if not status["date_valid"]:
              print("::error::Expected market close is unavailable. Last valid snapshot was retained.")
              raise SystemExit(1)
          PY
      - name: Warn on workflow failure
        if: failure()
        run: echo "::warning::Market refresh failed. Check run logs and the latest published freshness status."
