name: Update official market snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1-5' # 14:30 Taiwan time, weekdays
    - cron: '15 9 * * 1-5' # 17:15 Taiwan time, weekdays
    - cron: '15 15 * * 1-5' # 23:15 Taiwan time, weekdays
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official datasets
        run: python scripts/update_snapshot.py
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update official market snapshots"
            git push
          fi
